usb_host:
  max_packet_size: 512
  full_speed_only: true

usb_bluetooth:
  - id: usb_bt
    bluedroid: true
    pause_ble_scan: streaming
    on_speaker_volume:
      - logger.log:
          format: "Speaker volume %.2f"
          args: [x]

esp32_ble_tracker:

speaker:
  - platform: usb_bluetooth
    id: bt_speaker

select:
  - platform: usb_bluetooth
    speaker:
      name: Bluetooth speaker

event:
  - platform: usb_bluetooth
    speaker_buttons:
      name: Speaker buttons

text_sensor:
  - platform: usb_bluetooth
    speaker_status:
      name: Speaker status
